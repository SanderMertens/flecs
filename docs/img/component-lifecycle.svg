<text class="label" x="440" y="420">OnAdd observers</text>
<rect class="node " x="180.0" y="402.0" width="100" height="36" rx="7"/>
<text class="label" x="230" y="420">is set?</text>
<rect class="node blue" x="175.0" y="492.0" width="110" height="36" rx="7"/>
<text class="label mono" x="230" y="510">on_set hook</text>
<rect class="node accent" x="160.0" y="572.0" width="140" height="36" rx="7"/>
<text class="label" x="230" y="590">OnSet observers</text>
<rect class="node " x="755.0" y="132.0" width="100" height="36" rx="7"/>
<text class="label" x="805" y="150">has(c)?</text>
<rect class="node accent" x="725.0" y="222.0" width="160" height="36" rx="7"/>
<text class="label" x="805" y="240">OnRemove observers</text>
<rect class="node blue" x="740.0" y="312.0" width="130" height="36" rx="7"/>
<text class="label mono" x="805" y="330">on_remove hook</text>
<rect class="node blue" x="750.0" y="402.0" width="110" height="36" rx="7"/>
<text class="label" x="805" y="420">dtor</text>
<rect class="node " x="700.0" y="486.0" width="210" height="48" rx="7"/>
<text class="label" x="805" y="502.0">is clear/delete or</text>
<text class="label" x="805" y="518.0">last component?</text>
