<svg xmlns="http://www.w3.org/2000/svg" class="fl-svg-component-lifecycle" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="fl-svg-component-lifecycle-title">
<title id="fl-svg-component-lifecycle-title">Component lifecycle: which hooks and observers run on add, set and remove</title>
<style>
svg.fl-svg-component-lifecycle {
  --d-node: #f6f7f9;
  --d-node-stroke: #c9d0d8;
  --d-text: #1c2128;
  --d-muted: #6b7280;
  --d-line: #8b95a1;
  --d-accent: #42b983;
  --d-accent-bg: #e6f6ee;
  --d-blue: #3b82f6;
  --d-blue-bg: #e8f0fe;
  --d-canvas: transparent;
}
@media (prefers-color-scheme: dark) {
  svg.fl-svg-component-lifecycle {
    --d-node: #1e232b;
    --d-node-stroke: #3a424d;
    --d-text: #d9dee5;
    --d-muted: #8b95a1;
    --d-line: #7d8590;
    --d-accent-bg: #16302a;
    --d-blue-bg: #17233a;
  }
}
svg.fl-svg-component-lifecycle .bg { fill: var(--d-canvas); }
svg.fl-svg-component-lifecycle .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.5; }
svg.fl-svg-component-lifecycle .node.accent { fill: var(--d-accent-bg); stroke: var(--d-accent); }
svg.fl-svg-component-lifecycle .node.blue { fill: var(--d-blue-bg); stroke: var(--d-blue); }
svg.fl-svg-component-lifecycle .label { fill: var(--d-text); font: 500 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
svg.fl-svg-component-lifecycle .label.mono { font: 500 13px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg.fl-svg-component-lifecycle .label .b { font-weight: 700; }
svg.fl-svg-component-lifecycle .note { fill: var(--d-muted); font: italic 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; dominant-baseline: central; }
svg.fl-svg-component-lifecycle .note.center { text-anchor: middle; }
svg.fl-svg-component-lifecycle .note.right { text-anchor: start; }
svg.fl-svg-component-lifecycle .note.left { text-anchor: end; }
svg.fl-svg-component-lifecycle .edge { fill: none; stroke: var(--d-line); stroke-width: 1.5; marker-end: url(#fl-svg-component-lifecycle-arrow); }
svg.fl-svg-component-lifecycle .edge.plain { marker-end: none; }
svg.fl-svg-component-lifecycle .arrow { fill: var(--d-line); }
svg.fl-svg-component-lifecycle .edgelabel { fill: var(--d-muted); font: italic 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
</style>
<defs><marker id="fl-svg-component-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="1000" height="640"/>

<rect class="node " x="40.0" y="22.0" width="100" height="36" rx="7"/>
<text class="label mono" x="90" y="40">modified(c)</text>
<rect class="node " x="180.0" y="22.0" width="100" height="36" rx="7"/>
<text class="label mono" x="230" y="40">add(c)</text>
