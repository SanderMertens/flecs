<path class="edge" d="M400,489.0 L400,551.0"/>
<path class="edge" d="M455.0,570 L535.0,570"/>
<text class="note left" x="330" y="42.5">All entities of the same type</text>
<text class="note left" x="330" y="57.5">are stored in the same table</text>
<text class="note left" x="330" y="142.5">A type is the list of ids</text>
<text class="note left" x="330" y="157.5">an entity has</text>
<text class="note left" x="330" y="235.0">An id is anything that can be</text>
<text class="note left" x="330" y="250.0">added to an entity, including</text>
<text class="note left" x="330" y="265.0">other entities</text>
<text class="note left" x="330" y="342.5">A term is a single condition</text>
<text class="note left" x="330" y="357.5">in a query</text>
<text class="note left" x="330" y="462.5">A query finds all entities</text>
<text class="note left" x="330" y="477.5">that match a list of terms</text>
<text class="note left" x="330" y="555.0">An observer is a callback that</text>
<text class="note left" x="330" y="570.0">runs when an event matches</text>
<text class="note left" x="330" y="585.0">its query</text>
<text class="note right" x="850" y="42.5">A tag is an entity without</text>
<text class="note right" x="850" y="57.5">a datatype</text>
<text class="note right" x="850" y="142.5">A component is an entity</text>
<text class="note right" x="850" y="157.5">with a datatype</text>
<text class="note right" x="850" y="242.5">A relationship is the first</text>
<text class="note right" x="850" y="257.5">element of a pair</text>
<text class="note right" x="850" y="342.5">A target is the second</text>
<text class="note right" x="850" y="357.5">element of a pair</text>
<text class="note right" x="850" y="462.5">A phase determines when</text>
<text class="note right" x="850" y="477.5">a system runs</text>
<text class="note right" x="850" y="562.5">A pipeline schedules</text>
<text class="note right" x="850" y="577.5">and runs systems</text>
<text class="note center" x="590" y="37.5">An entity is a unique identifier</text>
<text class="note center" x="590" y="52.5">to which ids can be added</text>
<text class="note center" x="615" y="218.0">A pair is an id made of two entities</text>
<text class="note center" x="590" y="382.5">An id flag is a bit set on an id</text>
<text class="note center" x="590" y="397.5">to enable storage features</text>
<text class="note center" x="590" y="428.5">A system is a callback that runs</text>
<text class="note center" x="590" y="443.5">periodically for matching entities</text>
<text class="note center" x="590" y="602.5">An event determines when</text>
<text class="note center" x="590" y="617.5">an observer runs</text>
</svg>
